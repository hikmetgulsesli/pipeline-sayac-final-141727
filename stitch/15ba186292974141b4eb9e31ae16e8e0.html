<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ana Sayaç</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e7e8e9",
                        "surface-container": "#edeeef",
                        "background": "#f8f9fa",
                        "tertiary-container": "#b75b00",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e1e3e4",
                        "on-primary-fixed-variant": "#004395",
                        "secondary": "#495e8a",
                        "primary-container": "#2170e4",
                        "on-tertiary-fixed": "#311400",
                        "on-primary-container": "#fefcff",
                        "on-secondary-fixed": "#001a42",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#424754",
                        "inverse-primary": "#adc6ff",
                        "secondary-container": "#b6ccff",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#d8e2ff",
                        "on-tertiary-container": "#fffbff",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f0f1f2",
                        "on-surface": "#191c1d",
                        "primary": "#0058be",
                        "on-primary-fixed": "#001a42",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f3f4f5",
                        "on-secondary-container": "#405682",
                        "on-primary": "#ffffff",
                        "surface": "#f8f9fa",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c2c6d6",
                        "tertiary-fixed": "#ffdcc6",
                        "on-tertiary-fixed-variant": "#723600",
                        "tertiary": "#924700",
                        "surface-tint": "#005ac2",
                        "surface-bright": "#f8f9fa",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#304671",
                        "outline": "#727785",
                        "on-background": "#191c1d",
                        "primary-fixed": "#d8e2ff",
                        "surface-container-highest": "#e1e3e4",
                        "inverse-surface": "#2e3132",
                        "primary-fixed-dim": "#adc6ff",
                        "secondary-fixed-dim": "#b1c6f9",
                        "tertiary-fixed-dim": "#ffb786",
                        "surface-dim": "#d9dadb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body antialiased">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 w-full flex justify-between items-center px-8 h-16 bg-[#f8f9fa]/80 dark:bg-slate-900/80 backdrop-blur-[20px] shadow-[0_1px_0_0_rgba(0,0,0,0.05)] dark:shadow-none font-['Inter'] font-medium tracking-tight">
<div class="text-xl font-bold text-slate-900 dark:text-slate-50 tracking-[-0.02em]">
            ZenCounter
        </div>
<div class="flex items-center gap-4">
<button class="text-blue-600 dark:text-blue-400 hover:bg-slate-100/50 dark:hover:bg-slate-800/50 transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">history</span>
</button>
<button class="text-blue-600 dark:text-blue-400 hover:bg-slate-100/50 dark:hover:bg-slate-800/50 transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-4 pb-28">
<!-- Centerpiece Counter Card -->
<div class="w-full max-w-[340px] bg-surface-container-lowest rounded-xl p-10 flex flex-col items-center shadow-[0_20px_40px_rgba(17,24,39,0.06)] relative overflow-hidden">
<!-- Subtle Asymmetric Ambient Light -->
<div class="absolute -top-16 -left-16 w-48 h-48 bg-primary-container rounded-full blur-[60px] opacity-20 pointer-events-none"></div>
<!-- Main Value Display -->
<div class="relative z-10 flex flex-col items-center mt-4 mb-8">
<span class="text-[72px] font-bold font-display leading-none tracking-tighter bg-gradient-to-br from-primary to-primary-container bg-clip-text text-transparent">
                    5
                </span>
<span class="mt-4 font-label text-xs tracking-[0.05em] text-on-surface-variant uppercase">
                    Min: 0, Max: 10
                </span>
</div>
<!-- Action Buttons -->
<div class="w-full flex items-center justify-between gap-4 z-10 relative mt-4">
<!-- Decrease Button -->
<button class="flex flex-col items-center justify-center w-16 h-16 bg-surface-container-high rounded-lg text-primary active:scale-95 transition-transform duration-200 group">
<span class="material-symbols-outlined text-[20px] group-active:opacity-70 transition-opacity" style="font-variation-settings: 'wght' 400;">remove</span>
<span class="text-[10px] font-medium mt-1">Azalt</span>
</button>
<!-- Increase Button (Primary Hero Interaction) -->
<button class="flex flex-col items-center justify-center w-20 h-20 bg-surface-tint rounded-xl text-on-primary shadow-[0_12px_24px_rgba(0,90,194,0.25)] active:scale-95 transition-transform duration-200 group -translate-y-2">
<span class="material-symbols-outlined text-[32px] group-active:opacity-80 transition-opacity" style="font-variation-settings: 'wght' 300;">add</span>
<span class="text-[11px] font-medium mt-1">Artır</span>
</button>
<!-- Reset Button -->
<button class="flex flex-col items-center justify-center w-16 h-16 bg-surface-container-high rounded-lg text-primary active:scale-95 transition-transform duration-200 group">
<span class="material-symbols-outlined text-[20px] group-active:opacity-70 transition-opacity" style="font-variation-settings: 'wght' 400;">restart_alt</span>
<span class="text-[10px] font-medium mt-1">Sıfırla</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 pb-6 pt-2 bg-white/80 dark:bg-slate-950/80 backdrop-blur-[20px] rounded-t-[24px] border-none shadow-[0_-20px_40px_rgba(17,24,39,0.06)] md:hidden">
<!-- Active Tab: Counter -->
<button class="flex flex-col items-center justify-center bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-[12px] p-3 active:scale-90 transition-all duration-200 min-w-[72px]">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">exposure</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-[0.05em] uppercase">Counter</span>
</button>
<!-- Inactive Tab: Sessions -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 p-3 hover:text-blue-500 transition-all active:scale-90 duration-200 min-w-[72px]">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">timer</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-[0.05em] uppercase">Sessions</span>
</button>
<!-- Inactive Tab: Preferences -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 p-3 hover:text-blue-500 transition-all active:scale-90 duration-200 min-w-[72px]">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">tune</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-[0.05em] uppercase">Preferences</span>
</button>
</nav>
</body></html>
