<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sayaç</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#e7e8e9",
                    "surface-container": "#edeeef",
                    "background": "#f8f9fa",
                    "tertiary-container": "#b75b00",
                    "error-container": "#ffdad6",
                    "surface-variant": "#e1e3e4",
                    "on-primary-fixed-variant": "#004395",
                    "secondary": "#495e8a",
                    "primary-container": "#2170e4",
                    "on-tertiary-fixed": "#311400",
                    "on-primary-container": "#fefcff",
                    "on-secondary-fixed": "#001a42",
                    "on-secondary": "#ffffff",
                    "on-surface-variant": "#424754",
                    "inverse-primary": "#adc6ff",
                    "secondary-container": "#b6ccff",
                    "error": "#ba1a1a",
                    "secondary-fixed": "#d8e2ff",
                    "on-tertiary-container": "#fffbff",
                    "on-error-container": "#93000a",
                    "inverse-on-surface": "#f0f1f2",
                    "on-surface": "#191c1d",
                    "primary": "#0058be",
                    "on-primary-fixed": "#001a42",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#f3f4f5",
                    "on-secondary-container": "#405682",
                    "on-primary": "#ffffff",
                    "surface": "#f8f9fa",
                    "surface-container-lowest": "#ffffff",
                    "outline-variant": "#c2c6d6",
                    "tertiary-fixed": "#ffdcc6",
                    "on-tertiary-fixed-variant": "#723600",
                    "tertiary": "#924700",
                    "surface-tint": "#005ac2",
                    "surface-bright": "#f8f9fa",
                    "on-error": "#ffffff",
                    "on-secondary-fixed-variant": "#304671",
                    "outline": "#727785",
                    "on-background": "#191c1d",
                    "primary-fixed": "#d8e2ff",
                    "surface-container-highest": "#e1e3e4",
                    "inverse-surface": "#2e3132",
                    "primary-fixed-dim": "#adc6ff",
                    "secondary-fixed-dim": "#b1c6f9",
                    "tertiary-fixed-dim": "#ffb786",
                    "surface-dim": "#d9dadb"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "display": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col relative overflow-x-hidden">
<!-- TopAppBar (Web & Tablet) -->
<header class="hidden md:flex sticky top-0 z-50 w-full justify-between items-center px-8 h-16 bg-[#f8f9fa]/80 backdrop-blur-[20px] shadow-[0_1px_0_0_rgba(0,0,0,0.05)] shadow-sm">
<div class="flex items-center gap-4">
<span class="text-xl font-bold text-slate-900 tracking-[-0.02em] font-headline">ZenCounter</span>
</div>
<nav class="flex gap-6">
<a class="text-blue-600 font-bold hover:bg-slate-100/50 transition-colors active:scale-95 duration-200 px-3 py-2 rounded-lg flex items-center gap-2" href="#">
<span class="material-symbols-outlined">exposure</span>
                Counter
            </a>
<a class="text-slate-500 hover:bg-slate-100/50 transition-colors active:scale-95 duration-200 px-3 py-2 rounded-lg flex items-center gap-2" href="#">
<span class="material-symbols-outlined">timer</span>
                Sessions
            </a>
<a class="text-slate-500 hover:bg-slate-100/50 transition-colors active:scale-95 duration-200 px-3 py-2 rounded-lg flex items-center gap-2" href="#">
<span class="material-symbols-outlined">tune</span>
                Preferences
            </a>
</nav>
<div class="flex items-center gap-4 text-blue-600">
<button class="hover:bg-slate-100/50 p-2 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">history</span>
</button>
<button class="hover:bg-slate-100/50 p-2 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-6 md:p-12 mb-24 md:mb-0">
<!-- Empty State Container -->
<div class="w-full max-w-lg flex flex-col items-center justify-center bg-surface-container-lowest rounded-[2rem] p-10 md:p-16 shadow-[0_20px_40px_rgba(17,24,39,0.06)] relative overflow-hidden">
<!-- Subtle Background Accents -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-primary-fixed-dim/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-20 -left-20 w-64 h-64 bg-secondary-fixed-dim/20 rounded-full blur-3xl pointer-events-none"></div>
<!-- The Hero Value (Asymmetric placement hint) -->
<div class="mb-8 w-full text-center">
<span class="font-display font-extrabold text-[120px] leading-none text-on-surface opacity-20 tracking-tighter block mb-4">0</span>
</div>
<!-- Contextual Messaging -->
<div class="text-center mb-12 flex flex-col items-center gap-4 z-10">
<div class="bg-primary/10 px-4 py-1.5 rounded-full inline-flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-sm">info</span>
<span class="font-label text-xs font-semibold text-primary uppercase tracking-[0.05em]">Boş Durum</span>
</div>
<h2 class="font-headline text-2xl font-semibold text-on-surface mb-2">Sayaç sıfır.</h2>
<p class="font-body text-base text-on-surface-variant max-w-xs mx-auto leading-relaxed">
                    Artırmak için aşağıdaki 'Artır' butonuna tıklayın. Yeni bir seans başlatmaya hazırsınız.
                </p>
</div>
<!-- Primary Action -->
<button class="z-10 group relative inline-flex items-center justify-center gap-3 px-8 py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-xl font-medium text-lg active:scale-95 transition-all duration-200 shadow-[0_10px_20px_rgba(0,88,190,0.2)] hover:shadow-[0_15px_30px_rgba(0,88,190,0.3)] w-full sm:w-auto">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span>Artır</span>
<div class="absolute inset-0 rounded-xl bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>
</main>
<!-- BottomNavBar (Mobile) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 pb-6 pt-2 bg-white/80 backdrop-blur-[20px] rounded-t-[24px] shadow-[0_-20px_40px_rgba(17,24,39,0.06)] bg-slate-50">
<a class="flex flex-col items-center justify-center bg-blue-50 text-blue-700 rounded-[12px] p-3 hover:text-blue-500 transition-all active:scale-90 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">exposure</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-[0.05em] uppercase truncate w-full text-center">Counter</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 p-3 hover:text-blue-500 transition-all active:scale-90 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">timer</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-[0.05em] uppercase truncate w-full text-center">Sessions</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 p-3 hover:text-blue-500 transition-all active:scale-90 duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">tune</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-[0.05em] uppercase truncate w-full text-center">Prefs</span>
</a>
</nav>
</body></html>
